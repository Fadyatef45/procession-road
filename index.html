<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>طريق الموكب — مثل العريس</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="top">
    <h1>طريق الموكب — رحلة العريس</h1>
    <button class="g" id="fs">⛶ ملء الشاشة</button>
    <button class="g" id="pv">→</button>
    <button id="nx">←</button>
  </div>

  <!-- الطريق: شريحة أفقية طويلة -->
  <div id="sc">
    <div id="cv">
      <svg id="sv">
        <path id="rd0" fill="none" stroke="var(--rd)" stroke-width="34" stroke-linecap="round"/>
        <path id="rd1" fill="none" stroke="var(--ac)" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round" opacity=".7"/>
      </svg>
      <div id="gr">🤵</div>
    </div>
  </div>

  <!-- لوحة الطقس والآية -->
  <div id="pn"></div>

  <!-- الترتيب مهم: البيانات ثم الطريق ثم الحركة ثم التحكم ثم البداية -->
  <script src="js/data.js"></script>
  <script src="js/road.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
